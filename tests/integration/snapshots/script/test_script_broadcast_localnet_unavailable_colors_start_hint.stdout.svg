<svg xmlns="http://www.w3.org/2000/svg" width="1348" height="290"><style>.fg{fill:#aaa}.bg{fill:#000}.fg-cyan{fill:#0aa}.fg-green{fill:#0a0}.fg-yellow{fill:#a50}.container{padding:0 10px;line-height:18px}.bold{font-weight:700}tspan{font:14px SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;white-space:pre;line-height:18px}</style><rect width="100%" height="100%" y="0" class="bg" rx="4.5"/><text class="container fg" xml:space="preserve"><tspan x="10" y="28"><tspan class="fg-green bold">Installing</tspan><tspan> standard library [ACTON_VERSION]</tspan> </tspan> <tspan x="10" y="46"><tspan>Script finished with [EXIT_STATUS] </tspan><tspan class="fg-yellow">100</tspan> </tspan> <tspan x="10" y="64"><tspan> Re-run with </tspan><tspan class="fg-yellow">--backtrace full</tspan><tspan> to get more information</tspan> </tspan> <tspan x="10" y="82"><tspan>Failed to send message to real network: could not reach network </tspan><tspan class="fg-cyan">localnet</tspan><tspan> while sending external message from wallet </tspan><tspan class="fg-yellow">deployer</tspan><tspan>; likely causes:</tspan> </tspan> <tspan x="10" y="100"><tspan>- network API endpoint is not running or is unreachable</tspan> </tspan> <tspan x="10" y="118"><tspan>- configured </tspan><tspan class="fg-cyan">api.v2</tspan><tspan> URL points to the wrong host or port</tspan> </tspan> <tspan x="10" y="136"><tspan>- a firewall, proxy, or temporary service outage blocked the request</tspan> </tspan> <tspan x="10" y="154"> </tspan> <tspan x="10" y="172"><tspan>Possible fix:</tspan> </tspan> <tspan x="10" y="190"><tspan>- start localnet with </tspan><tspan class="fg-yellow">acton simulator start</tspan> </tspan> <tspan x="10" y="208"><tspan>- if localnet uses a custom port, check </tspan><tspan class="fg-cyan">[localnet].port</tspan><tspan> and </tspan><tspan class="fg-cyan">[networks.localnet].api.v2</tspan><tspan> in Acton.toml</tspan> </tspan> <tspan x="10" y="226"> </tspan> <tspan x="10" y="244"><tspan>Details:</tspan> </tspan> <tspan x="10" y="262"><tspan>Failed to send BOC: error sending request for url ([LOCALHOST_URL]/api/v2/sendBoc): client error (Connect): tcp connect error: Connection refused ([OS_ERROR])</tspan></tspan></text></svg>